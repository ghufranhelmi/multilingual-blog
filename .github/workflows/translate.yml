name: Auto-translate posts

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/en/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install translator dependency
        run: npm install --no-save --no-package-lock --ignore-scripts gray-matter

      - name: Translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/translate.mjs --all
          else
            node scripts/translate.mjs "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Commit translations
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
          else
            git commit -m "chore: auto-translate posts"
            git pull --rebase
            git push
          fi
