backend:
  name: github
  repo: ghufranhelmi/multilingual-blog
  branch: main
  base_url: https://multilingual-blog-auth.ghufranhelmi.workers.dev
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "public/images"
public_folder: "/images"

site_url: https://multilingual-blog.ghufranhelmi.workers.dev
display_url: https://multilingual-blog.ghufranhelmi.workers.dev

collections:
  - name: "blog_en"
    label: "Blog — English"
    folder: "src/content/blog/en"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "blog_zh"
    label: "Blog — 中文"
    folder: "src/content/blog/zh"
    create: true
    delete: true
